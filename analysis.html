<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAS LAB · 광고 상세 분석</title>
<link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --navy:#0A0E27; --navy2:#111634; --panel:#141a3a; --line:rgba(255,255,255,.08);
    --indigo:#4F8CFF; --indigo-lt:#8FB4FF; --teal:#2EE6A6; --teal-lt:#7CEFC6;
    --amber:#F5A524; --txt:#E9ECF5; --muted:#8A92B2; --faint:#5A6288;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(1200px 600px at 80% -10%,rgba(79,140,255,.10),transparent 60%),var(--navy);
    font-family:'Pretendard',system-ui,sans-serif; color:var(--txt); min-height:100vh; display:flex; justify-content:center; padding:28px 18px;}
  .mono{font-family:'Reddit Mono',monospace; font-variant-numeric:tabular-nums;}
  .wrap{width:100%; max-width:1320px; background:var(--navy); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.5);}

  /* header */
  .gnb{display:flex; align-items:center; gap:4px; padding:10px 16px; border-bottom:1px solid var(--line); background:#0b0f28;}
  .gnb .brand{display:flex; align-items:center; gap:10px; margin-right:16px;}
  .gnb .brand img{height:22px; width:auto; display:block;}
  .gnb a{font-size:13px; color:var(--muted); text-decoration:none; padding:8px 15px; border-radius:9px; font-weight:600;}
  .gnb a:hover{color:var(--txt); background:rgba(255,255,255,.05);}
  .gnb a.active{color:var(--teal); background:rgba(46,230,166,.1);}
  .head{display:flex; align-items:center; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0d1230,transparent); flex-wrap:wrap;}
  .title{display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; letter-spacing:.3px;}
  .title .dot{width:9px;height:9px;border-radius:3px;background:var(--teal);box-shadow:0 0 12px var(--teal);}
  .title small{font-size:10px;color:var(--faint);letter-spacing:1.5px;font-weight:500;}
  .filters{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}
  .chip{font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:9px; padding:8px 12px; background:var(--navy2); cursor:pointer; font-family:inherit;}
  .chip:hover{border-color:rgba(255,255,255,.2);} .chip b{color:var(--txt); font-weight:600;}
  .pop-wrap{position:relative;}
  .pop{position:absolute; top:calc(100% + 8px); right:0; z-index:40; width:250px; max-width:calc(100vw - 40px); background:#0d1230; border:1px solid rgba(255,255,255,.12); border-radius:12px; box-shadow:0 18px 44px rgba(0,0,0,.55); padding:12px; opacity:0; transform:translateY(-6px); pointer-events:none; transition:.16s;}
  .pop.open{opacity:1; transform:none; pointer-events:auto;}
  .pp-presets{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .pp-preset{font-family:inherit; font-size:12px; color:var(--muted); background:var(--navy2); border:1px solid var(--line); border-radius:8px; padding:8px 6px; cursor:pointer;}
  .pp-preset.on{color:#0A0E27; background:var(--teal); border-color:var(--teal); font-weight:600;}
  .pp-div{height:1px; background:var(--line); margin:11px 0;}
  .pp-label{font-size:10px; color:var(--faint); margin-bottom:8px;}
  .pp-dates{display:flex; align-items:center; gap:6px;}
  .pp-dates input{flex:1; min-width:0; font-family:'Reddit Mono',monospace; font-size:11px; color:var(--txt); background:var(--navy2); border:1px solid var(--line); border-radius:7px; padding:6px 7px; color-scheme:dark;}
  .pp-apply{width:100%; margin-top:9px; font-family:inherit; font-size:12px; font-weight:600; color:#0A0E27; background:var(--teal); border:none; border-radius:8px; padding:8px; cursor:pointer;}
  .mrow{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--txt); padding:7px 4px; cursor:pointer;}
  .mrow input{accent-color:var(--teal); width:15px; height:15px;}
  .mrow .bdg{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800;}
  .b-g{background:#EA4335;color:#fff;} .b-m{background:#0866FF;color:#fff;} .b-n{background:#03C75A;color:#fff;} .b-k{background:#FEE500;color:#3A1D1D;}
  #media-btn{display:inline-flex; align-items:center; gap:6px;}
  #media-label{display:inline-flex; align-items:center; gap:9px; vertical-align:middle;}
  .mtag{display:inline-flex; align-items:center; gap:5px;}
  .mtag .bdg{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:800;}

  /* kpi */
  .kpis{display:grid; grid-template-columns:repeat(4,1.18fr) repeat(3,0.88fr); gap:1px; background:var(--line);}
  .kpi{background:var(--navy); padding:16px 18px;}
  .kpi .lbl{font-size:11px; color:var(--muted); margin-bottom:8px;}
  .kpi .val{font-size:22px; font-weight:600; line-height:1;}
  .kpi .val.teal{color:var(--teal);}
  .kpi.sm{padding:14px 16px; background:#0c1130;}
  .kpi.sm .lbl{font-size:10px;}
  .kpi.sm .val{font-size:15px; color:var(--muted);}
  @media(max-width:1080px){ .kpis{grid-template-columns:repeat(4,1fr);} }
  @media(max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr);} }

  .body{padding:20px 22px 26px;}
  .card{border:1px solid var(--line); border-radius:12px; background:var(--navy2); padding:16px 18px; margin-bottom:20px;}
  .card-h{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
  .card-t{font-size:12px; color:var(--txt); font-weight:600; letter-spacing:.3px;}
  .card-sub{font-size:10.5px; color:var(--faint);}
  .seg{margin-left:auto; display:flex; gap:2px; background:var(--navy); border:1px solid var(--line); border-radius:9px; padding:2px;}
  .seg button{font-family:inherit; font-size:11.5px; color:var(--muted); background:transparent; border:none; border-radius:7px; padding:6px 13px; cursor:pointer;}
  .seg button.on{color:#0A0E27; background:var(--teal); font-weight:600;}
  .ts-legend{display:flex; gap:15px; font-size:10.5px; color:var(--muted); margin-bottom:8px;}
  .ts-legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
  .sw-rev{background:#5B77B0;} .sw-spend{background:#89B0FE;} .sw-line{background:#2EE6A6;}
  .ac-box{position:relative;} #ac-chart{width:100%;}
  .empty{padding:40px; text-align:center; color:var(--faint); font-size:12px;}
  .ac-hit{cursor:pointer;} .ac-hit:hover{fill:rgba(255,255,255,.05);}
  .ts-tip{position:absolute; left:0; top:0; pointer-events:none; opacity:0; transition:opacity .12s; background:#0d1230; border:1px solid rgba(255,255,255,.14); border-radius:9px; padding:9px 11px; min-width:170px; box-shadow:0 14px 34px rgba(0,0,0,.55); z-index:5;}
  .ts-tip .d{font-family:'Reddit Mono',monospace; font-size:12px; font-weight:600; margin-bottom:7px;}
  .ts-tip .r{display:flex; justify-content:space-between; gap:18px; font-size:11px; color:var(--muted); margin-top:4px;}
  .ts-tip .r b{font-family:'Reddit Mono',monospace; color:var(--txt);} .ts-tip .r b.teal{color:var(--teal);}

  /* pivot */
  .pv-head{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .pv-title{font-size:13px; font-weight:700;}
  .cnt{font-size:11px; color:var(--indigo-lt); border:1px solid rgba(79,140,255,.3); background:rgba(79,140,255,.08); border-radius:20px; padding:3px 10px; font-family:'Reddit Mono','Pretendard',sans-serif;}
  .dl{margin-left:auto; font-family:inherit; font-size:12px; font-weight:600; color:#0A0E27; background:var(--teal); border:none; border-radius:9px; padding:9px 14px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .dl:hover{filter:brightness(1.08);}
  .pv-body{display:grid; grid-template-columns:190px minmax(0,1fr); gap:16px;}
  @media(max-width:820px){ .pv-body{grid-template-columns:minmax(0,1fr);} }
  .pv-side{border:1px solid var(--line); border-radius:12px; background:var(--navy2); padding:14px 15px; align-self:start;}
  .pv-side h4{margin:0 0 12px; font-size:11px; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; font-weight:600;}
  .dim{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--txt); padding:8px 4px; cursor:pointer; border-radius:7px;}
  .dim:hover{background:rgba(255,255,255,.03);}
  .dim input{accent-color:var(--teal); width:15px; height:15px;}
  .cols-wrap{border:1px solid var(--line); border-radius:12px; background:var(--navy2); padding:12px 14px; margin-bottom:12px;}
  .cols-wrap .lbl{font-size:10px; color:var(--faint); letter-spacing:.4px; margin-bottom:9px;}
  .cols{display:flex; gap:6px; flex-wrap:wrap;}
  .colchip{font-family:inherit; font-size:11.5px; color:var(--faint); background:var(--navy); border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:grab; transition:border-color .12s,color .12s,background .12s; display:inline-flex; align-items:center; gap:5px;}
  .colchip .grip{color:var(--faint); font-size:11px; cursor:grab;}
  .colchip.on{color:var(--txt); border-color:rgba(79,140,255,.5); background:rgba(79,140,255,.12);}
  .colchip.drag{opacity:.4;}
  .colchip.over{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset;}
  .tbl-scroll{overflow:auto; max-height:560px; border:1px solid var(--line); border-radius:12px;}
  table.pv{width:100%; border-collapse:collapse; font-size:12.5px; white-space:nowrap;}
  .pv thead th{position:sticky; top:0; z-index:2; background:var(--navy2); text-align:right; padding:11px 13px; border-bottom:1px solid var(--line); font-size:11px; color:var(--muted); font-weight:600; cursor:pointer; user-select:none;}
  .pv thead th.l{text-align:left;} .pv thead th:hover{color:var(--txt);}
  .pv thead th .ar{color:var(--teal); margin-left:3px;}
  .pv td{padding:12px 13px; border-bottom:1px solid rgba(255,255,255,.05); text-align:right; color:var(--muted); font-family:'Reddit Mono',monospace;}
  .pv td.l{text-align:left; color:var(--txt); font-family:'Pretendard',sans-serif; font-weight:500;}
  .pv td.rev{color:var(--txt); font-weight:600;}
  .pv td.roas{color:var(--teal); font-weight:600;}
  .pv tbody tr:hover td{background:rgba(79,140,255,.05);}
  .pv tbody tr:last-child td{border-bottom:none;}
</style>
</head>
<body>
  <div class="wrap">
    <nav class="gnb">
      <span class="brand"><img src="thecap.png" alt="theCAP"><img src="logo.png" alt="ROAS Lab"></span>
      <a href="roas-lab-overview.html">대시보드 홈</a>
      <a href="analysis.html" class="active">광고 분석</a>
    </nav>
    <div class="head">
      <div class="title"><span class="dot"></span>광고 상세 분석 <small>DETAIL &amp; PIVOT</small></div>
      <div class="filters">
        <div class="pop-wrap">
          <button class="chip" id="date-btn">기간 <b id="date-label">최근 30일</b> ▾</button>
          <div class="pop" id="date-pop">
            <div class="pp-presets">
              <button class="pp-preset on" data-days="30">최근 30일</button>
              <button class="pp-preset" data-days="14">최근 14일</button>
              <button class="pp-preset" data-days="7">최근 7일</button>
              <button class="pp-preset" data-days="1">어제</button>
            </div>
            <div class="pp-div"></div>
            <div class="pp-label">직접 선택</div>
            <div class="pp-dates"><input type="date" id="d-start"><span style="color:var(--faint)">–</span><input type="date" id="d-end"></div>
            <button class="pp-apply" id="d-apply">적용</button>
          </div>
        </div>
        <div class="pop-wrap">
          <button class="chip" id="media-btn">매체 <b id="media-label">전체</b> ▾</button>
          <div class="pop" id="media-pop" style="width:200px"></div>
        </div>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="body">
      <div class="card">
        <div class="card-h">
          <span class="card-t">일별 매출 · 광고비 · ROAS</span><span class="card-sub" id="ac-range"></span>
          <div class="seg" id="gran">
            <button data-g="day" class="on">일</button><button data-g="week">주</button><button data-g="month">월</button>
          </div>
        </div>
        <div class="ts-legend"><span><i class="sw-rev"></i>매출</span><span><i class="sw-spend"></i>광고비</span><span><i class="sw-line"></i>ROAS</span></div>
        <div class="ac-box"><div id="ac-chart"></div><div class="ts-tip" id="ac-tip"></div></div>
      </div>

      <div class="pv-head">
        <span class="pv-title">상세 데이터</span>
        <span class="cnt" id="pv-count">0건</span>
        <button class="dl" id="dl-btn">⭳ 엑셀 다운로드</button>
      </div>
      <div class="pv-body">
        <div class="pv-side">
          <h4>피벗 기준</h4>
          <div id="dim-list"></div>
        </div>
        <div>
          <div class="cols-wrap">
            <div class="lbl">↔ 표시 컬럼 · 드래그로 순서 변경</div>
            <div class="cols" id="col-list"></div>
          </div>
          <div class="tbl-scroll"><table class="pv"><thead id="pv-thead"></thead><tbody id="pv-tbody"></tbody></table></div>
        </div>
      </div>
    </div>
  </div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const won=v=>'₩'+Math.round(v).toLocaleString('ko-KR');
const intf=v=>Math.round(v).toLocaleString('ko-KR');
const pctf=v=>(v*100).toFixed(2)+'%';
const pct100=v=>Math.round(v*100)+'%';

const DIMS=[
  {key:'month',label:'날짜(월)'},{key:'day',label:'날짜(일)'},
  {key:'media',label:'매체'},{key:'source',label:'소스'},
  {key:'campaign',label:'캠페인'},{key:'product',label:'상품명'},{key:'productId',label:'상품ID'}
];
const METRICS=[
  {key:'revenue',label:'매출액',type:'won'},
  {key:'spend',label:'광고비',type:'won'},
  {key:'custom_spend',label:'광고비(Custom)',type:'won'},
  {key:'roas',label:'ROAS',type:'pct100'},
  {key:'cpm',label:'CPM',type:'won'},
  {key:'ctr',label:'CTR',type:'pct'},
  {key:'cpc',label:'CPC',type:'won'},
  {key:'cvr',label:'CVR',type:'pct'},
  {key:'cpa',label:'CPA',type:'won'},
  {key:'impressions',label:'노출수',type:'int'},
  {key:'reach',label:'도달수',type:'int'},
  {key:'clicks',label:'클릭수',type:'int'},
  {key:'ga_sessions',label:'GA세션수',type:'int'},
  {key:'orders',label:'주문수',type:'int'},
  {key:'new_customers',label:'신규고객수',type:'int'}
];
const METRIC_BY=Object.fromEntries(METRICS.map(m=>[m.key,m]));
const DEFAULT_COLS=['revenue','spend','roas','cpm','ctr','cpc','cvr','cpa','orders'];

let FACTS=[], MEDIA_META={}, DAYS=[], MINISO, MAXISO;
const state={ start:null, end:null, media:new Set(), dims:['media','campaign'],
  colOrder:METRICS.map(m=>m.key), cols:new Set(DEFAULT_COLS),
  sort:{key:'roas',dir:'desc'}, gran:'day' };
let curCombo=[];

/* ---------- 데이터 로드 ---------- */
async function load(){
  const res=await fetch('roas-facts.json',{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j=await res.json();
  FACTS=j.rows; MEDIA_META=j.media; DAYS=j.days;
  MINISO=j.meta.period_available.start; MAXISO=j.meta.period_available.end;
}

/* ---------- 필터/집계 ---------- */
const inRange=r=>r.date>=state.start && r.date<=state.end && state.media.has(r.media);
function rows(){ return FACTS.filter(inRange); }

function dimVal(k,r){
  if(k==='month'){const[y,m]=r.date.split('-'); return `${y}년 ${+m}월`;}
  if(k==='day'){const[y,m,d]=r.date.split('-'); return `${y}년 ${+m}월 ${+d}일`;}
  if(k==='media') return MEDIA_META[r.media].name;
  if(k==='source') return r.source;
  if(k==='campaign') return r.utm_campaign;
  if(k==='product') return r.product_name;
  if(k==='productId') return r.product_id;
}
const activeDims=()=>DIMS.filter(d=>state.dims.includes(d.key));
const activeCols=()=>state.colOrder.filter(k=>state.cols.has(k)).map(k=>METRIC_BY[k]);

function pivot(){
  const rs=rows(), dims=activeDims(), g=new Map();
  rs.forEach(r=>{
    const dv=dims.map(d=>dimVal(d.key,r)), key=dv.join('␟');
    let o=g.get(key);
    if(!o){o={dv,src:new Set(),revenue:0,spend:0,custom_spend:0,impressions:0,reach:0,clicks:0,ga_sessions:0,orders:0,new_customers:0}; g.set(key,o);}
    o.src.add(r.source);
    o.revenue+=r.revenue; o.spend+=r.spend; o.custom_spend+=r.custom_spend;
    o.impressions+=r.impressions; o.reach+=r.reach; o.clicks+=r.clicks;
    o.ga_sessions+=r.ga_sessions; o.orders+=r.orders; o.new_customers+=r.new_customers;
  });
  let arr=[...g.values()].map(o=>({
    dv:o.dv, source:[...o.src].join(', '),
    revenue:o.revenue, spend:o.spend, custom_spend:o.custom_spend,
    roas:o.spend?o.revenue/o.spend:0, cpm:o.impressions?o.spend/o.impressions*1000:0,
    ctr:o.impressions?o.clicks/o.impressions:0, cpc:o.clicks?o.spend/o.clicks:0,
    cvr:o.clicks?o.orders/o.clicks:0, cpa:o.new_customers?o.spend/o.new_customers:0,
    impressions:o.impressions, reach:o.reach, clicks:o.clicks,
    ga_sessions:o.ga_sessions, orders:o.orders, new_customers:o.new_customers
  }));
  const s=state.sort, sign=s.dir==='asc'?1:-1;
  arr.sort((a,b)=>{
    if(s.key.startsWith('dim:')){const i=+s.key.slice(4); return (a.dv[i]<b.dv[i]?-1:a.dv[i]>b.dv[i]?1:0)*sign;}
    if(s.key==='source') return (a.source<b.source?-1:a.source>b.source?1:0)*sign;
    return (a[s.key]-b[s.key])*sign;
  });
  return arr;
}

/* ---------- KPI ---------- */
function renderKPI(){
  const rs=rows(); let rev=0,sp=0,or=0,cl=0,im=0,nc=0;
  rs.forEach(r=>{rev+=r.revenue;sp+=r.spend;or+=r.orders;cl+=r.clicks;im+=r.impressions;nc+=r.new_customers;});
  const cards=[
    {l:'실 ROAS', v:sp?pct100(rev/sp):'—', teal:true},
    {l:'매출액', v:won(rev)},
    {l:'광고비', v:won(sp)},
    {l:'주문수', v:intf(or)},
    {l:'CPM', v:im?won(sp/im*1000):'—', sm:true},
    {l:'CPC', v:cl?won(sp/cl):'—', sm:true},
    {l:'CPA', v:nc?won(sp/nc):'—', sm:true}
  ];
  $('#kpis').innerHTML=cards.map(c=>`<div class="kpi${c.sm?' sm':''}"><div class="lbl">${c.l}</div><div class="val mono${c.teal?' teal':''}">${c.v}</div></div>`).join('');
}

/* ---------- 콤보 (일/주/월) ---------- */
function bucketKey(iso){
  if(state.gran==='month') return iso.slice(0,7);
  if(state.gran==='day') return iso;
  const d=new Date(iso+'T00:00:00Z'); const dow=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dow);
  return d.toISOString().slice(0,10);
}
function bucketLabel(k){
  if(state.gran==='month') return (+k.slice(5,7))+'월';
  return k.slice(5).replace('-','.');
}
function combo(){
  const m=new Map();
  rows().forEach(r=>{const k=bucketKey(r.date); let o=m.get(k); if(!o){o={k,rev:0,sp:0}; m.set(k,o);} o.rev+=r.revenue; o.sp+=r.spend;});
  return [...m.values()].sort((a,b)=>a.k<b.k?-1:1);
}
function renderCombo(){
  const data=combo(); curCombo=data;
  const range=$('#ac-range');
  if(!data.length){ $('#ac-chart').innerHTML='<div class="empty">선택한 조건에 데이터가 없습니다.</div>'; range.textContent=''; return; }
  range.textContent=`${state.start.replace(/-/g,'.')} – ${state.end.replace(/-/g,'.')} · ${state.gran==='day'?'일':state.gran==='week'?'주':'월'} 단위`;
  const W=940,H=240,padL=14,padR=14,padT=18,padB=30;
  const pw=W-padL-padR,ph=H-padT-padB,n=data.length;
  const vmax=Math.max(...data.map(t=>t.rev))||1;
  const roas=data.map(t=>t.sp?t.rev/t.sp*100:0);
  const rlo=Math.min(...roas)-70,rhi=Math.max(...roas)+70,rspan=(rhi-rlo)||1;
  const cx=i=>n>1?padL+(i+0.5)*pw/n:W/2;
  const bw=Math.min(34,pw/n*0.6), colW=pw/n, step=n>16?Math.ceil(n/13):1;
  let bars='',grid='',line='',dots='',hits='';
  for(let g=0;g<=3;g++){const y=padT+ph*g/3; grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,.05)"/>`;}
  data.forEach((t,i)=>{
    const x=cx(i),rh=t.rev/vmax*ph,sh=t.sp/vmax*ph;
    bars+=`<rect x="${x-bw/2}" y="${padT+ph-rh}" width="${bw}" height="${rh}" rx="3" fill="#5B77B0"/>`;
    bars+=`<rect x="${x-bw/2}" y="${padT+ph-sh}" width="${bw}" height="${sh}" rx="2.5" fill="#89B0FE"/>`;
    const ry=padT+ph-(roas[i]-rlo)/rspan*ph; line+=`${x},${ry} `;
    dots+=`<circle cx="${x}" cy="${ry}" r="2.6" fill="#2EE6A6"/>`;
    if(i%step===0||i===n-1) grid+=`<text x="${x}" y="${H-10}" text-anchor="middle" fill="#5A6288" font-size="9" font-family="Reddit Mono">${bucketLabel(t.k)}</text>`;
    hits+=`<rect class="ac-hit" data-i="${i}" x="${x-colW/2}" y="${padT}" width="${colW}" height="${ph}" fill="transparent"/>`;
  });
  const lt=n>1?`<polyline points="${line.trim()}" fill="none" stroke="#2EE6A6" stroke-width="2" stroke-linejoin="round"/>`:'';
  $('#ac-chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${grid}${bars}${lt}${dots}${hits}</svg>`;
  bindHover();
}
function bindHover(){
  const box=$('.ac-box'), tip=$('#ac-tip');
  $$('.ac-hit',box).forEach(r=>{
    r.addEventListener('mousemove',e=>{
      const t=curCombo[+r.dataset.i], net=t.rev-t.sp, ro=t.sp?(t.rev/t.sp*100).toFixed(0):'—';
      tip.innerHTML=`<div class="d">${bucketLabel(t.k)}${state.gran!=='month'?' ('+t.k.slice(0,4)+')':''}</div>
        <div class="r"><span>매출</span><b>${won(t.rev)}</b></div>
        <div class="r"><span>광고비</span><b>${won(t.sp)}</b></div>
        <div class="r"><span>순규모</span><b>${won(net)}</b></div>
        <div class="r"><span>ROAS</span><b class="teal">${ro}%</b></div>`;
      tip.style.opacity='1';
      const bb=box.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
      let x=e.clientX-bb.left+14,y=e.clientY-bb.top+12;
      if(x+tw>bb.width)x=e.clientX-bb.left-tw-14; if(y+th>bb.height)y=bb.height-th-4; if(y<0)y=4;
      tip.style.left=x+'px'; tip.style.top=y+'px';
    });
    r.addEventListener('mouseleave',()=>tip.style.opacity='0');
  });
}

/* ---------- 피벗 테이블 ---------- */
function fmt(type,v){ return type==='won'?won(v):type==='int'?intf(v):type==='pct'?pctf(v):type==='pct100'?pct100(v):v; }
function renderPivot(){
  const dims=activeDims(), cols=activeCols(), arr=pivot();
  $('#pv-count').textContent=arr.length.toLocaleString('ko-KR')+'건';
  const s=state.sort;
  const arrow=key=>s.key===key?`<span class="ar">${s.dir==='desc'?'▼':'▲'}</span>`:'';
  let thead='<tr>';
  dims.forEach((d,i)=>thead+=`<th class="l" data-sort="dim:${i}">${d.label}${arrow('dim:'+i)}</th>`);
  cols.forEach(c=>thead+=`<th class="${c.type==='text'?'l':''}" data-sort="${c.key}">${c.label}${arrow(c.key)}</th>`);
  thead+='</tr>';
  $('#pv-thead').innerHTML=thead;
  if(!arr.length){ $('#pv-tbody').innerHTML=`<tr><td class="l" colspan="${dims.length+cols.length}"><div class="empty">데이터 없음</div></td></tr>`; bindSort(); return; }
  $('#pv-tbody').innerHTML=arr.map(row=>{
    let tds=dims.map((d,i)=>`<td class="l">${row.dv[i]}</td>`).join('');
    tds+=cols.map(c=>{
      if(c.type==='text') return `<td class="l">${row.source}</td>`;
      const cls=c.key==='revenue'?' rev':c.key==='roas'?' roas':'';
      return `<td class="${cls.trim()}">${fmt(c.type,row[c.key])}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  bindSort();
}
function bindSort(){
  $$('#pv-thead th').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.sort;
    if(state.sort.key===k) state.sort.dir=state.sort.dir==='desc'?'asc':'desc';
    else state.sort={key:k,dir: k.startsWith('dim:')||k==='source'?'asc':'desc'};
    renderPivot();
  }));
}

/* ---------- CSV(엑셀) 다운로드 ---------- */
function csvCell(v){ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadCSV(){
  const dims=activeDims(), cols=activeCols(), arr=pivot();
  const header=[...dims.map(d=>d.label),...cols.map(c=>c.label)];
  const lines=[header.map(csvCell).join(',')];
  arr.forEach(row=>{
    const cells=[...row.dv.map(csvCell)];
    cols.forEach(c=>{
      if(c.type==='text') cells.push(csvCell(row.source));
      else if(c.type==='pct') cells.push((row[c.key]*100).toFixed(2));
      else if(c.type==='pct100') cells.push(Math.round(row[c.key]*100));
      else cells.push(Math.round(row[c.key]));
    });
    lines.push(cells.join(','));
  });
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`ROAS_상세데이터_${state.start}_${state.end}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}

/* ---------- 컨트롤 렌더 ---------- */
function renderDimList(){
  $('#dim-list').innerHTML=DIMS.map(d=>`<label class="dim"><input type="checkbox" data-dim="${d.key}" ${state.dims.includes(d.key)?'checked':''}>${d.label}</label>`).join('');
  $$('#dim-list input').forEach(cb=>cb.addEventListener('change',()=>{
    const k=cb.dataset.dim;
    if(cb.checked){ if(!state.dims.includes(k)) state.dims.push(k); }
    else state.dims=state.dims.filter(x=>x!==k);
    // 정렬 기준이 사라진 dim이면 첫 컬럼으로 리셋
    if(state.sort.key.startsWith('dim:') && +state.sort.key.slice(4)>=activeDims().length) state.sort={key:'roas',dir:'desc'};
    renderPivot();
  }));
}
let dragKey=null, justDragged=false;
function renderColList(){
  $('#col-list').innerHTML=state.colOrder.map(k=>{const m=METRIC_BY[k];
    return `<button class="colchip${state.cols.has(k)?' on':''}" draggable="true" data-col="${k}"><span class="grip">⠿</span>${m.label}</button>`;}).join('');
  $$('#col-list .colchip').forEach(b=>{
    // 토글 (드래그 직후 클릭은 무시)
    b.addEventListener('click',()=>{
      if(justDragged){ justDragged=false; return; }
      const k=b.dataset.col;
      if(state.cols.has(k)){ if(state.cols.size>1) state.cols.delete(k); }
      else state.cols.add(k);
      if(!state.cols.has(state.sort.key) && !state.sort.key.startsWith('dim:')) state.sort={key:'roas',dir:'desc'};
      renderColList(); renderPivot();
    });
    // 드래그로 순서 변경
    b.addEventListener('dragstart',e=>{ dragKey=b.dataset.col; e.dataTransfer.effectAllowed='move'; b.classList.add('drag'); });
    b.addEventListener('dragend',()=>b.classList.remove('drag'));
    b.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; b.classList.add('over'); });
    b.addEventListener('dragleave',()=>b.classList.remove('over'));
    b.addEventListener('drop',e=>{
      e.preventDefault(); b.classList.remove('over');
      const tgt=b.dataset.col;
      if(dragKey && dragKey!==tgt){
        const arr=state.colOrder.filter(k=>k!==dragKey);
        arr.splice(arr.indexOf(tgt),0,dragKey);
        state.colOrder=arr; justDragged=true;
        renderColList(); renderPivot();
      }
      dragKey=null;
    });
  });
}
function renderMediaPop(){
  const keys=Object.keys(MEDIA_META);
  const all=keys.every(k=>state.media.has(k));
  let html=`<label class="mrow" id="m-all"><input type="checkbox" ${all?'checked':''}><b style="color:var(--txt)">전체</b></label><div class="pp-div"></div>`;
  html+=keys.map(k=>{const m=MEDIA_META[k]; return `<label class="mrow"><input type="checkbox" data-m="${k}" ${state.media.has(k)?'checked':''}><span class="bdg ${m.cls}">${m.badge}</span>${m.name}</label>`;}).join('');
  const pop=$('#media-pop'); pop.innerHTML=html;
  $('#m-all input').addEventListener('change',e=>{ state.media=e.target.checked?new Set(keys):new Set(); renderMediaPop(); updateMediaLabel(); renderAll(); });
  $$('#media-pop input[data-m]').forEach(cb=>cb.addEventListener('change',()=>{
    const k=cb.dataset.m;
    if(cb.checked) state.media.add(k); else state.media.delete(k);
    if(state.media.size===0) state.media.add(k), cb.checked=true; // 최소 1개 유지
    renderMediaPop(); updateMediaLabel(); renderAll();
  }));
}
function updateMediaLabel(){
  const keys=Object.keys(MEDIA_META), sel=keys.filter(k=>state.media.has(k));
  const el=$('#media-label');
  if(sel.length===keys.length){ el.textContent='전체'; return; }   // 전체는 텍스트로
  el.innerHTML=sel.map(k=>{const m=MEDIA_META[k];
    return `<span class="mtag"><span class="bdg ${m.cls}">${m.badge}</span>${m.name}</span>`;}).join('');
}

/* ---------- 기간 셀렉터 ---------- */
function setDates(start,end,label){ state.start=start; state.end=end; $('#date-label').textContent=label; }
function presetDates(days){ const end=MAXISO, start=DAYS[Math.max(0,DAYS.length-days)]; return {start,end}; }
function fmtMMDD(iso){const p=iso.split('-');return p[1]+'.'+p[2];}

function renderAll(){ renderKPI(); renderCombo(); renderPivot(); }

/* ---------- 초기화 ---------- */
window.addEventListener('load', async ()=>{
  try{ await load(); }
  catch(e){ document.querySelector('.wrap').insertAdjacentHTML('afterbegin',
    `<div style="margin:16px;padding:16px;border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.08);border-radius:12px;color:#F87171;font-size:13px;line-height:1.7;"><b>데이터를 불러오지 못했습니다.</b> (${e.message})<br><span style="color:#8A92B2;">로컬 서버로 서빙해야 합니다: </span><code style="color:#2EE6A6;">python -m http.server 8000</code></div>`); return; }

  const qs=new URLSearchParams(location.search);
  const keys=Object.keys(MEDIA_META);
  // 매체: 쿼리로 진입했다면 그 매체만 선택
  const qm=qs.get('media');
  state.media = (qm && MEDIA_META[qm]) ? new Set([qm]) : new Set(keys);
  // 기간: 쿼리 start/end 있으면 사용, 없으면 최근 30일(전체)
  const qStart=qs.get('start'), qEnd=qs.get('end');
  if(qStart&&qEnd){
    setDates(qStart<MINISO?MINISO:qStart, qEnd>MAXISO?MAXISO:qEnd, `${fmtMMDD(qStart)} – ${fmtMMDD(qEnd)}`);
    $$('.pp-preset').forEach(b=>b.classList.remove('on'));
  } else {
    const d=presetDates(30); setDates(d.start,d.end,'최근 30일');
  }
  $('#d-start').min=$('#d-end').min=MINISO; $('#d-start').max=$('#d-end').max=MAXISO;
  $('#d-start').value=state.start; $('#d-end').value=state.end;

  renderDimList(); renderColList(); renderMediaPop(); updateMediaLabel(); renderAll();

  // 기간 팝업
  wirePopup('#date-btn','#date-pop');
  $$('.pp-preset').forEach(b=>b.addEventListener('click',()=>{
    const days=+b.dataset.days, d=presetDates(days);
    setDates(d.start,d.end,b.textContent);
    $$('.pp-preset').forEach(x=>x.classList.toggle('on',x===b));
    $('#d-start').value=state.start; $('#d-end').value=state.end;
    $('#date-pop').classList.remove('open'); renderAll();
  }));
  $('#d-apply').addEventListener('click',()=>{
    let a=$('#d-start').value, b=$('#d-end').value; if(!a||!b) return; if(a>b){[a,b]=[b,a];}
    setDates(a,b,`${fmtMMDD(a)} – ${fmtMMDD(b)}`);
    $$('.pp-preset').forEach(x=>x.classList.remove('on'));
    $('#date-pop').classList.remove('open'); renderAll();
  });
  // 매체 팝업
  wirePopup('#media-btn','#media-pop');
  // 집계 단위
  $$('#gran button').forEach(b=>b.addEventListener('click',()=>{
    state.gran=b.dataset.g; $$('#gran button').forEach(x=>x.classList.toggle('on',x===b)); renderCombo();
  }));
  $('#dl-btn').addEventListener('click',downloadCSV);
});

function wirePopup(btnSel,popSel){
  const btn=$(btnSel), pop=$(popSel);
  btn.addEventListener('click',e=>{ e.stopPropagation(); $$('.pop.open').forEach(p=>{if(p!==pop)p.classList.remove('open');}); pop.classList.toggle('open'); });
  pop.addEventListener('click',e=>e.stopPropagation());
  document.addEventListener('click',()=>pop.classList.remove('open'));
}
</script>
